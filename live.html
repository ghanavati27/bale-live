<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVE — دوربین</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0f14;color:#e6eef8;font-family:system-ui,Tahoma;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
  h1{font-size:15px;margin-bottom:8px;font-weight:600;white-space:nowrap}
  #wrap{position:relative;width:min(720px,95vw);background:#111a24;border-radius:14px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4)}
  #live{width:100%;height:auto;display:block;background:#0a0e13;min-height:280px;object-fit:contain}
  #overlay{position:absolute;inset:auto 8px 8px auto;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);padding:5px 9px;border-radius:9px;font-size:12px;line-height:1.7}
  #overlay b{color:#7dd3fc}
  #status{margin-top:9px;font-size:12px;line-height:1.7;opacity:.75;text-align:center;max-width:720px;word-break:break-all}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;margin-left:5px;animation:pulse 1.1s infinite}
  .off-dot{background:#ef4444;box-shadow:0 0 8px #ef4444;animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<h1><span id="dot" class="live-dot"></span> پخش زنده — از طریق بله</h1>
<div id="wrap">
  <img id="live" alt="live">
  <div id="overlay">
    فریم: <b id="seq">—</b> | دانلود: <b id="lat">—</b>ms<br>
    نرخ: <b id="fps">—</b> fps | عمر فریم: <b id="age">—</b>s
  </div>
</div>
<div id="status">در حال خواندن اطلاعات از آدرس...</div>

<script>
// =====================================================================
// این فایل هیچ رمز/توکنی داخلش ندارد و می‌تواند روی یک ریپوی PUBLIC
// گیت‌هاب (GitHub Pages) میزبانی شود.
//
// توکن و chat_id از بخش fragment آدرس (بعد از #) خوانده می‌شود — این بخش
// هرگز به هیچ سروری (نه گیت‌هاب، نه جای دیگر) ارسال نمی‌شود؛ فقط همین
// جاوااسکریپت که همین الان در مرورگر شما اجرا می‌شود آن را می‌بیند.
//
// لینک این صفحه را فقط روتر (با توکن واقعی) می‌سازد و فقط در پیام خصوصی
// بله برایتان می‌فرستد — نه در هیچ فایل یا کامیت گیت‌هابی.
//
// فرمت مورد انتظار آدرس:
//   .../live.html#token=BOT_TOKEN&chat=CHAT_ID
// =====================================================================

var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
var TOKEN = hash.get('token') || '';
var CHAT_ID = Number(hash.get('chat') || '0');

var API = 'https://tapi.bale.ai/bot' + TOKEN;
var FILE = 'https://tapi.bale.ai/file/bot' + TOKEN + '/';

var lastUid = 0;
var lastPath = null;
var lastTs = 0;
var n = 0, w0 = performance.now();

var img = document.getElementById('live');
var seqEl = document.getElementById('seq');
var latEl = document.getElementById('lat');
var fpsEl = document.getElementById('fps');
var ageEl = document.getElementById('age');
var statusEl = document.getElementById('status');
var dotEl = document.getElementById('dot');

function st(t, err) {
  statusEl.textContent = t;
  dotEl.className = err ? 'off-dot' : 'live-dot';
}

function show(p) {
  if (p === lastPath) return;
  lastPath = p;
  n++;
  var t0 = performance.now();
  img.src = FILE + p + '?t=' + Date.now();
  img.onload = function () {
    lastTs = Date.now();
    latEl.textContent = Math.round(performance.now() - t0);
    seqEl.textContent = n;
    var now = performance.now();
    if (now - w0 > 1000) {
      fpsEl.textContent = (n * 1000 / (now - w0)).toFixed(1);
      n = 0; w0 = now;
    }
  };
  img.onerror = function () { st('خطا در نمایش فریم — تلاش دوباره...', true); };
}

// اولین فراخوانی: بدون offset، تا آخرین آپدیت‌های موجود را بگیریم و
// جدیدترین عکس متعلق به CHAT_ID را به‌عنوان فریم شروع نشان دهیم.
var initialized = false;

async function poll() {
  try {
    if (!TOKEN || !CHAT_ID) {
      st('آدرس ناقص است — token یا chat در fragment آدرس یافت نشد', true);
      return;
    }
    var url = API + '/getUpdates?limit=100&timeout=25' + (lastUid ? '&offset=' + (lastUid + 1) : '');
    var r = await fetch(url, { cache: 'no-store' });
    var j = await r.json();
    if (!j.ok) { st('پاسخ ناموفق از بله — تلاش دوباره', true); }
    var ups = j.result || [];
    var photo = null;
    for (var i = 0; i < ups.length; i++) {
      var u = ups[i];
      if (u.update_id > lastUid) lastUid = u.update_id;
      var m = u.message;
      if (m && m.chat && m.chat.id === CHAT_ID && m.photo && m.photo.length) {
        photo = m.photo[m.photo.length - 1];
      }
    }
    initialized = true;
    if (photo) {
      var gf = await fetch(API + '/getFile?file_id=' + photo.file_id, { cache: 'no-store' });
      var gj = await gf.json();
      if (gj.ok && gj.result && gj.result.file_path) {
        show(gj.result.file_path);
        st('متصل — دریافت فریم زنده');
      }
    } else if (lastTs) {
      st('متصل — منتظر فریم بعدی');
    } else {
      st('متصل — منتظر اولین فریم...');
    }
  } catch (e) {
    st('خطا: ' + e.message + ' — تلاش دوباره', true);
  }
  setTimeout(poll, 800);
}

setInterval(function () {
  if (lastTs) {
    var a = Math.round((Date.now() - lastTs) / 1000);
    ageEl.textContent = a;
    if (a > 10) st('قطع موقت — آخرین فریم ' + a + ' ثانیه پیش', true);
  }
}, 1000);

poll();
</script>
</body>
</html>
